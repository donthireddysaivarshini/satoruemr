<form autocomplete="off" novalidate="novalidate" class="or clearfix pages" dir="ltr" data-form-id="undo_death_report">
<section class="form-logo"></section><h3 dir="auto" id="form-title">Undo death report</h3>
<select id="form-languages" style="display:none;" data-default-lang=""><option value="en">en</option> </select>
  
  
    <section class="or-group-data or-branch pre-init or-appearance-field-list " name="/data/inputs" data-relevant="./source = 'user'"><section class="or-group-data " name="/data/inputs/contact"><label class="question non-select or-appearance-select-contact or-appearance-type-person "><span lang="en" class="question-label active" data-itext-id="/data/inputs/contact/_id:label">What is the patient's name?</span><input type="text" name="/data/inputs/contact/_id" data-type-xml="string"></label><section class="or-group-data " name="/data/inputs/contact/parent"><section class="or-group-data " name="/data/inputs/contact/parent/parent"><section class="or-group-data " name="/data/inputs/contact/parent/parent/contact">
      </section>
      </section>
      </section>
      </section>
      </section>
    <section class="or-group-data or-appearance-field-list " name="/data/undo"><fieldset class="question simple-select or-appearance-multiline ">
<fieldset>
<legend>
<span lang="en" class="question-label active" data-itext-id="/data/undo/undo_information:label"> Submitting this form will undo the death report of <span class="or-output" data-value=" /data/patient_display_name "> </span>. Are you sure you want to undo the death report?</span><span class="required">*</span>
          </legend>
<div class="option-wrapper">
<label class="itemset-template" data-items-path="instance('yes_no')/root/item"><input type="radio" name="/data/undo/undo_information" data-name="/data/undo/undo_information" data-required="true()" data-constraint=". = 'yes'" data-type-xml="string" value=""></label><span class="itemset-labels" data-value-ref="name" data-label-ref="label">
      </span>
</div>
</fieldset>
<span lang="en" class="or-constraint-msg active" data-itext-id="/data/undo/undo_information:jr:constraintMsg">Only submit this report if you want to undo the death report.</span><span class="or-required-msg active" lang="" data-i18n="constraint.required">This field is required</span>
</fieldset>
      </section>
    <section class="or-group-data or-appearance-hidden " name="/data/data"><section class="or-group-data " name="/data/data/meta">
      </section>
      </section>
  
<fieldset id="or-preload-items" style="display:none;"><label class="calculation non-select "><input type="hidden" name="/data/meta/instanceID" data-preload="uid" data-preload-params="" data-type-xml="string"></label></fieldset>
<fieldset id="or-calculated-items" style="display:none;">
<label class="calculation non-select "><input type="hidden" name="/data/patient_age_in_years" data-calculate="floor( difference-in-months(  /data/inputs/contact/date_of_birth , today() ) div 12 )" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_age_in_months" data-calculate="difference-in-months(  /data/inputs/contact/date_of_birth , today() )" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_age_in_days" data-calculate="floor(decimal-date-time(today()) - decimal-date-time( /data/inputs/contact/date_of_birth ) )" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_uuid" data-calculate="../inputs/contact/_id" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_id" data-calculate="../inputs/contact/patient_id" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_name" data-calculate="../inputs/contact/name" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_short_name" data-calculate="../inputs/contact/short_name" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_display_name" data-calculate="if(../patient_short_name = '', ../patient_name, concat(../patient_name, ' (', ../patient_short_name, ')'))" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/data/__confirm_undo" data-calculate=" /data/undo/undo_information " data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/data/meta/__patient_uuid" data-calculate="../../../inputs/contact/_id" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/data/meta/__patient_id" data-calculate="../../../inputs/contact/patient_id" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/data/meta/__household_uuid" data-calculate="../../../inputs/contact/parent/_id" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/data/meta/__source" data-calculate="../../../inputs/source" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/data/meta/__source_id" data-calculate="../../../inputs/source_id" data-type-xml="string"></label>
</fieldset>
</form>
